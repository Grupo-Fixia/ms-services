server:
  port: 8080

spring:
  application:
    name: ms-services

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ms-services}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:11MB}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_HOST:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    # Consumidor de los eventos de pago de ms-payments (GC-490). Confirmación manual: el offset se confirma solo después
    # de guardar el efecto en la base (al menos una vez).
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual_immediate

fixia:
  jwt:
    issuer: ${JWT_ISSUER:https://auth.fixia.com}
    audience: ${JWT_AUDIENCE:https://api.fixia.com}
    # PEM X.509 de la clave pública de ms-users. Obligatoria fuera de los perfiles local y test.
    public-key: ${JWT_PUBLIC_KEY:}
  users:
    # Clave compartida que protege las rutas /internal/** de este servicio. Desde GC-547 ms-services ya no llama a
    # ms-users ni a ms-matching-geo.
    internal-api-key: ${INTERNAL_API_KEY:}
  replication:
    # Cero dependencias síncronas (GC-547): ms-services publica participación y trabajo de los técnicos de empresa, y
    # guarda copia del estado de técnicos y empresas que publica ms-users.
    refresh: ${FIXIA_REPLICATION_REFRESH:PT6H}
    publisher:
      enabled: ${FIXIA_REPLICATION_PUBLISHER_ENABLED:true}
      interval-ms: ${FIXIA_REPLICATION_INTERVAL_MS:3000}
    consumer:
      enabled: ${FIXIA_REPLICATION_CONSUMER_ENABLED:true}
      topics: ${FIXIA_REPLICATION_TOPICS:fixia.users.technician-states,fixia.users.company-states}
      group-id: ${FIXIA_REPLICATION_CONSUMER_GROUP:ms-services-replication}
  storage:
    endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
    region: ${RUSTFS_REGION:us-east-1}
    bucket-evidences: ${RUSTFS_BUCKET_EVIDENCES:evidences}
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
  revocations:
    # Lista local de tokens revocados (GC-547): sesion.revocada de ms-users. Es la única fuente: no se llama a ms-users.
    # Si el consumidor no confirmó estar al día hace menos de max-staleness, se falla cerrado (401).
    max-staleness: ${FIXIA_REVOCATIONS_MAX_STALENESS:PT5S}
    lookback: ${FIXIA_REVOCATIONS_LOOKBACK:PT20M}
    idle-interval-ms: ${FIXIA_REVOCATIONS_IDLE_INTERVAL_MS:1000}
    consumer:
      enabled: ${FIXIA_REVOCATIONS_CONSUMER_ENABLED:true}
      topic: ${FIXIA_REVOCATIONS_TOPIC:fixia.users.sessions}
      group-prefix: ${FIXIA_REVOCATIONS_GROUP_PREFIX:ms-services-revocations}
  payments:
    # Resultado del pago virtual de cada contratación (pago.procesado / pago.fallido). El tópico lo crea DevOps.
    consumer:
      enabled: ${FIXIA_PAYMENTS_CONSUMER_ENABLED:true}
      topic: ${FIXIA_PAYMENTS_TOPIC:fixia.payments.events}
      group-id: ${FIXIA_PAYMENTS_CONSUMER_GROUP:ms-services}
      retry-delay-ms: ${FIXIA_PAYMENTS_CONSUMER_RETRY_DELAY_MS:5000}
  scheduling:
    # Margen mínimo entre las fechas acordadas de dos servicios activos del mismo técnico. Un servicio no guarda su
    # duración: con 2 horas, un servicio a las 10:00 bloquea de 08:01 a 11:59.
    min-gap: ${FIXIA_SCHEDULING_MIN_GAP:PT2H}
  outbox:
    relay:
      enabled: ${FIXIA_OUTBOX_RELAY_ENABLED:true}
      fixed-delay-ms: ${FIXIA_OUTBOX_RELAY_DELAY_MS:2000}
      initial-delay-ms: ${FIXIA_OUTBOX_RELAY_INITIAL_DELAY_MS:5000}
      batch-size: ${FIXIA_OUTBOX_RELAY_BATCH_SIZE:50}
      publish-timeout-seconds: ${FIXIA_OUTBOX_RELAY_TIMEOUT_SECONDS:5}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
