server:
  port: 8080

spring:
  application:
    name: ms-services

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ms-services}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

fixia:
  jwt:
    issuer: ${JWT_ISSUER:https://auth.fixia.com}
    audience: ${JWT_AUDIENCE:https://api.fixia.com}
    # PEM X.509 de la clave pública de ms-users. Obligatoria fuera de los perfiles local y test.
    public-key: ${JWT_PUBLIC_KEY:}
  users:
    # ms-users guarda la lista de tokens revocados: se le consulta en cada petición autenticada.
    base-url: ${USERS_BASE_URL:http://ms-users:8080}
    internal-api-key: ${INTERNAL_API_KEY:}
    connect-timeout: ${USERS_CONNECT_TIMEOUT:1s}
    read-timeout: ${USERS_READ_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
